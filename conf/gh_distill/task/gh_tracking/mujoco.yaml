# @package _global_
# GH tracking owner config (MuJoCo backend), Phase 9.6.
#
# DENYLIST fields (sim2sim contract) are declared explicitly and MUST stay byte-
# identical to motrix.yaml: algo.obs_groups, env.action.action_scale, env.sampling_mode.
# sim_backend / scene / motion.dirs are ALLOWLIST (free to differ per backend).
#
# NOTE: the full `algo=gh_distill` Hydra compose + sim2sim DENYLIST wiring land in
# Phase 10 (runner + distill-algo config group). Phase 9 delivers the task owner YAMLs
# as the cross-backend contract artifact; they are validated by direct load.
training:
  task_name: GHTracking
  sim_backend: mujoco
  play_steps: 1000
algo:
  num_envs: 4096
  max_iterations: 30000
  save_interval: 500
  obs_groups:            # DENYLIST — three GH groups
    policy:
      - policy
    priv:
      - priv
    priv_critic:
      - priv_critic
env:
  sampling_mode: sample_once   # DENYLIST
  control_config:
    action_scale:               # DENYLIST — GH per-joint regex (G1_gentle.yaml:13-22)
      .*elbow_joint: 1.0
      .*shoulder.*: 1.0
      .*wrist.*: 1.0
      .*hip_roll.*: 0.25
      .*hip_yaw.*: 0.25
      .*hip_pitch.*: 0.5
      .*knee.*: 0.5
      .*waist.*: 0.25
      .*ankle.*: 0.5
  scene:
    model_file: src/unilab/assets/robots/g1_gh/scene_flat.xml
  motion:
    # real interx/lafan/amass memmap dirs + weights set at train time (DP2: none yet)
    dirs: []
    weights: []
