defaults:
  - _self_
  - task: sonic_g1_tracking/mujoco

algo:
  algo: sonic_ppo
  algo_log_name: sonic_ppo
  seed: 1
  num_envs: 2
  num_steps_per_env: 8
  max_iterations: 1
  save_interval: 1
  actor_obs_dim: 930
  critic_obs_dim: 1645
  tokenizer_obs_dim: 1761
  action_dim: 29
  model_profile: sonic_release
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  tokenizer_hidden_dim: 512
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  value_loss_coef: 1.0
  entropy_coef: 0.01
  max_grad_norm: 0.1
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 3.0e-4
  schedule: constant
  desired_kl: 0.0
  use_clipped_value_loss: true
  use_amp: true
  amp_dtype: bf16
  distributed_gradient_overlap: true
  ddp_bucket_cap_mb: 25
  optimizer_step_per_microbatch: true
  aux_loss_coef:
    g1_recon: 1.0
    g1_smpl_latent: 1.0
    g1_teleop_latent: 1.0
    teleop_smpl_latent: 1.0
    reencoded_smpl_g1_latent: 1.0

training:
  task_name: SonicG1Tracking
  devices: null
  device: null
  logger: tensorboard
  wandb_project: unilab
  sim_backend: mujoco
  play_only: false
  no_play: true
  log_root: null
  log_dir: null

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]

