# SONIC release bridge profile.
#
# This file mirrors the policy-defining values in
# GR00T-WholeBodyControl/gear_sonic/config/exp/.../sonic_release.yaml.  It is
# intentionally a bridge profile rather than a claim that the existing flat
# RSL-RL motion-tracking task is SONIC-compatible.  `sonic.mode=preflight` is
# safe to run without a CUDA driver; `sonic.mode=train` selects the built-in
# native SonicPPO owner and should use a versioned motion manifest.

defaults:
  - _self_
  - task: sonic_g1_tracking/mujoco

algo:
  algo: sonic_ppo
  algo_log_name: sonic_ppo
  seed: 0
  # Per-rank value.  Eight ranks therefore use 32,768 environments globally.
  num_envs: 4096
  num_steps_per_env: 24
  max_iterations: 100000
  save_interval: 500
  num_learning_epochs: 5
  num_mini_batches: 4
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 0.1
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  learning_rate: 2.0e-5
  schedule: adaptive
  adaptive_lr_min: 1.0e-5
  adaptive_lr_max: 2.0e-4

training:
  # The target workstation profile.  Override with null/[0] for a smoke test.
  devices: [0, 1, 2, 3, 4, 5, 6, 7]
  device: null
  logger: tensorboard
  log_root: null
  log_dir: null
  # Warm-start checkpoint. Model, optimizer, normalizer, and iteration are
  # restored; simulator/sampler state is intentionally not called seamless.
  resume: null

sonic:
  mode: preflight
  # In train mode a missing entrypoint selects the built-in native owner.
  # Set this explicitly only for a separately packaged compatible owner.
  runtime_entrypoint: null
  source_repo: ~/ws/GR00T-WholeBodyControl
  motion_manifest: null
  require_motion_manifest: false
  use_manifest_clips: false
  # Each torchrun rank loads a disjoint clip subset.  This bounds host RAM at
  # roughly one eighth of the corpus on the target 8-GPU workstation.
  motion_shard_clips: true
  # Number of decoded clips retained per rank.  NPZ clips are bounded by this
  # LRU; NPY members remain OS-backed mmap views.
  motion_cache_size: 2
  verify_motion_checksums: true
  verify_motion_shapes: true
  # The release leaves per_device_train_batch_size unset, so the rank-local
  # logical minibatch (4096/4=1024 environment sequences) is one optimizer
  # update.  Keep this strict default; use the documented accumulation variant
  # only after profiling a 24 GB 4090 OOM.
  microbatch_size: 1024
  allow_microbatch_change: false
  require_dimensions: true
  dimensions:
    action_dim: 29
    actor_obs_dim: 930
    critic_obs_dim: 1645
    tokenizer_obs_dim: 1761
  model:
    # Release MLP widths; tiny CPU smoke tests can override this block.
    actor_hidden_dims: [2048, 2048, 1024, 1024, 512, 512]
    critic_hidden_dims: [2048, 2048, 1024, 1024, 512, 512]
    tokenizer_hidden_dim: 1024
    critic_obs_normalization: true
    token_count: 2
    token_levels: 32
    init_noise_std: 0.05
    std_clamp_min: 0.001
    std_clamp_max: 0.5
  # sonic_release.yaml samples G1, teleop and SMPL uniformly.
  encoder_sample_probs: [1.0, 1.0, 1.0]
  optimizer_step_per_microbatch: true
  aux_loss_coef:
    token_reconstruction: 0.01
    token_commitment: 0.0
  resources:
    enabled: true
    profile: sonic-8x4090-76c-2numa
    # Preflight may discover a best-effort PCI-BDF topology when NVML/driver
    # access is unavailable. Train mode is fail-closed and requires an
    # explicit rank-ordered list because PCI order is not a CUDA ordinal
    # contract; set it after checking nvidia-smi on the target host.
    detect_gpu_numa: true
    gpu_numa_nodes: null
    workers_per_rank: 6
    torch_num_threads: 2
    torch_num_interop_threads: 1
    pin_process: false
    # RTX 4090 PCIe topology must be benchmarked with NCCL defaults and
    # explicit P2P/SHM overrides; do not inherit the RTX 6000D workaround.
    nccl_compat_defaults: false

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
