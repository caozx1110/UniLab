# SONIC bridge profile targeting the original release recipe.
#
# The observation ABI targets
# GR00T-WholeBodyControl/gear_sonic/config/exp/manager/universal_token/
# all_modes/sonic_release.yaml at the pinned revision below.  This remains
# intentionally an observation bridge profile, not a claim that named-model or
# reward/task parity is complete.  `sonic.mode=preflight` is safe to run without
# a CUDA driver; `sonic.mode=train` selects the built-in native SonicPPO owner
# and should use a versioned motion manifest.

defaults:
  - _self_
  - task: sonic_g1_tracking/mujoco

algo:
  algo: sonic_ppo
  algo_log_name: sonic_ppo
  seed: 0
  # Per-rank value.  Eight ranks therefore use 32,768 environments globally.
  num_envs: 4096
  num_steps_per_env: 24
  max_iterations: 100000
  # Keep periodic checkpoints on the 200-step global-mmap sampler-sync
  # cadence; saving itself must never add a collective.
  save_interval: 1000
  num_learning_epochs: 5
  num_mini_batches: 4
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 0.1
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  learning_rate: 2.0e-5
  schedule: adaptive
  adaptive_lr_min: 1.0e-5
  adaptive_lr_max: 2.0e-4

training:
  # The target workstation profile.  Override with null/[0] for a smoke test.
  devices: [0, 1, 2, 3, 4, 5, 6, 7]
  device: null
  logger: tensorboard
  log_root: null
  log_dir: null
  # Checkpoint to restore. Model, optimizer, normalizer, and iteration are
  # restored. Unsharded global-mmap runs also restore adaptive counters;
  # rank-local sampler counters and simulator/RNG state remain warm-start only.
  resume: null

sonic:
  # The task/backend owner is the single source; owner validation also pins
  # these resolved values so CLI overrides cannot forge provenance.
  target_recipe: ${sonic.owner.target_recipe}
  target_revision: ${sonic.owner.target_revision}
  observation_profile: ${sonic.owner.observation_profile}
  mode: preflight
  # In train mode a missing entrypoint selects the built-in native owner.
  # Set this explicitly only for a separately packaged compatible owner.
  runtime_entrypoint: null
  source_repo: ~/ws/GR00T-WholeBodyControl
  motion_manifest: null
  require_motion_manifest: false
  use_manifest_clips: false
  # Explicit opt-in to a separately published global mmap sidecar. It is
  # fail-closed with clip sharding and resident hot fields; owner defaults
  # remain on the bounded lazy/rank-local path until benchmarked.
  motion_global_mmap_sidecar: null
  # Optional trusted receipt emitted by the sidecar materializer after one
  # complete cold-path audit. This is not a cryptographic re-audit after the
  # filesystem changes; explicit opt-in requires full field coverage.
  motion_global_mmap_trusted_receipt: null
  # Each torchrun rank loads a disjoint clip subset.  This bounds host RAM at
  # roughly one eighth of the corpus on the target 8-GPU workstation.
  motion_shard_clips: true
  # Safe fallback: no complete fields are resident and the lazy cache remains
  # bounded. The release MuJoCo owner overrides the eight rollout-hot fields.
  motion_hot_fields: []
  motion_cache_size: 2
  verify_motion_checksums: true
  verify_motion_shapes: true
  # Upstream averages the full-corpus adaptive counters across ranks every
  # 200 completed PPO iterations. Rank-local clip shards deliberately skip
  # this collective because their bin coordinates differ.
  sync_adaptive_sampling_all_gpus_freq: 200
  # The release leaves per_device_train_batch_size unset, so the rank-local
  # logical minibatch (4096/4=1024 environment sequences) is one optimizer
  # update.  Keep this strict default; use the documented accumulation variant
  # only after profiling a 24 GB 4090 OOM.
  microbatch_size: 1024
  allow_microbatch_change: false
  require_dimensions: true
  dimensions:
    action_dim: 29
    actor_obs_dim: 930
    critic_obs_dim: 1645
    tokenizer_obs_dim: 1761
  model:
    profile: sonic_release
    contract_version: sonic_release_named_universal_token.v1
    # Flat storage ABI parsed into the pinned release fields on the model
    # cold path. command-z remains in the ABI but is not consumed by an encoder.
    tokenizer_fields:
      encoder_index: {slice: [0, 3], shape: [3]}
      command_multi_future_nonflat: {slice: [3, 583], shape: [10, 58]}
      command_z_multi_future_nonflat: {slice: [583, 593], shape: [10, 1]}
      command_z: {slice: [593, 594], shape: [1]}
      motion_anchor_ori_b: {slice: [594, 600], shape: [6]}
      motion_anchor_ori_b_mf_nonflat: {slice: [600, 660], shape: [10, 6]}
      command_multi_future_lower_body: {slice: [660, 900], shape: [240]}
      vr_3point_local_target: {slice: [900, 909], shape: [9]}
      vr_3point_local_orn_target: {slice: [909, 921], shape: [12]}
      smpl_joints_multi_future_local_nonflat: {slice: [921, 1641], shape: [10, 72]}
      smpl_root_ori_b_multi_future: {slice: [1641, 1701], shape: [10, 6]}
      joint_pos_multi_future_wrist_for_smpl: {slice: [1701, 1761], shape: [10, 6]}
    encoders:
      g1:
        inputs: [command_multi_future_nonflat, motion_anchor_ori_b_mf_nonflat]
        temporal: true
        hidden_dims: [2048, 1024, 512, 512]
      teleop:
        inputs:
          - command_multi_future_lower_body
          - vr_3point_local_target
          - vr_3point_local_orn_target
          - motion_anchor_ori_b
        temporal: false
        hidden_dims: [2048, 1024, 512, 512]
      smpl:
        inputs:
          - smpl_joints_multi_future_local_nonflat
          - smpl_root_ori_b_multi_future
          - joint_pos_multi_future_wrist_for_smpl
        temporal: true
        hidden_dims: [2048, 1024, 512, 512]
    decoders:
      g1_dyn:
        inputs: [token_flattened, actor_obs]
        outputs:
          action: [29]
        hidden_dims: [2048, 2048, 1024, 1024, 512, 512]
      g1_kin:
        inputs: [token_flattened]
        outputs:
          command_multi_future_nonflat: [10, 58]
          motion_anchor_ori_b_mf_nonflat: [10, 6]
        hidden_dims: [2048, 1024, 512, 512]
    critic:
      hidden_dims: [2048, 2048, 1024, 1024, 512, 512]
    critic_obs_normalization: true
    token_count: 2
    token_levels: 32
    init_noise_std: 0.05
    std_clamp_min: 0.001
    std_clamp_max: 0.5
  # sonic_release.yaml samples G1, teleop and SMPL uniformly.
  encoder_sample_probs: [1.0, 1.0, 1.0]
  optimizer_step_per_microbatch: true
  # Pinned sonic_release auxiliary/cycle recipe.  All five are MSE in the
  # upstream implementation; the configured teleop detach flag is not acted
  # upon by that pinned loss class, so UniLab preserves the executed gradient.
  aux_loss_coef:
    g1_recon: 0.01
    g1_smpl_latent: 1.0
    g1_teleop_latent: 1.0
    teleop_smpl_latent: 1.0
    reencoded_smpl_g1_latent: 1.0
  resources:
    enabled: true
    profile: sonic-8x4090-76c-2numa
    # Train mode requires this rank-ordered mapping to be supplied explicitly
    # on hosts with multiple NUMA nodes; the launch command for the validated
    # 8x4090 workstation passes [0,0,0,1,1,1,1,1].
    detect_gpu_numa: true
    gpu_numa_nodes: null
    # NUMA1 owns five GPU ranks and 38 physical cores, so seven workers per
    # rank is the largest uniform allocation without physical-core overlap.
    workers_per_rank: 7
    torch_num_threads: 2
    torch_num_interop_threads: 1
    pin_process: false
    # RTX 4090 PCIe topology must be benchmarked with NCCL defaults and
    # explicit P2P/SHM overrides; do not inherit the RTX 6000D workaround.
    nccl_compat_defaults: false

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
