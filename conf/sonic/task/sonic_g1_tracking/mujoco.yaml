# @package _global_
# Verified SONIC baseline owner. Backend identity, task timing, and reward
# injection live here; switching backend requires another explicit owner file.
training:
  task_name: SonicG1Tracking
  sim_backend: mujoco

sonic:
  owner:
    task_name: SonicG1Tracking
    sim_backend: mujoco

env:
  # SONIC's physics timing: 0.005 * 4 = 0.02 s control period.
  sim_dt: 0.005
  decimation: 4
  ctrl_dt: null

reward:
  scales:
    motion_global_root_pos: 0.5
    motion_global_root_ori: 0.5
    motion_body_pos: 1.0
    motion_body_ori: 1.0
    motion_body_lin_vel: 1.0
    motion_body_ang_vel: 1.0
    motion_ee_body_pos_z: 0.0
    motion_joint_pos: 0.0
    motion_joint_vel: 0.0
    action_rate_l2: -0.1
    joint_limit: -10.0
  std_root_pos: 0.3
  std_root_ori: 0.4
  std_body_pos: 0.3
  std_body_ori: 0.4
  std_body_lin_vel: 1.0
  std_body_ang_vel: 3.14
  std_joint_pos: 0.2
  std_joint_vel: 1.0
